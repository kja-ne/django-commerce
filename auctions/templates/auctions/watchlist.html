{% extends "auctions/layout.html" %}

{% block body %}
<h2>Your Watchlist</h2>

{% for listing in listings %}
    <div>
        <a href="{% url 'listing_detail' listing.id %}">
            {{ listing.title }}
        </a>
        - ${{ listing.current_price }}
    </div>
{% empty %}
    <p>No items in watchlist.</p>
{% endfor %}

{% endblock %}
